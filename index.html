<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDC SAFETY - REMOTE DASHBOARD</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0g2jxFOY5KQGZeZWyJf0SDxA91sitpxE",
            authDomain: "chamdiemonline-898b1.firebaseapp.com",
            projectId: "chamdiemonline-898b1",
            databaseURL: "https://chamdiemonline-898b1-default-rtdb.firebaseio.com/",
            storageBucket: "chamdiemonline-898b1.firebasestorage.app",
            messagingSenderId: "1073615877091",
            appId: "1:1073615877091:web:b70fa88f2cf740085fe6d6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Lắng nghe thông báo hệ thống
        onValue(ref(db, 'status'), (snap) => {
            const data = snap.val();
            if(data) {
                const el = document.getElementById('sysStatus');
                el.innerText = data.msg;
                el.style.backgroundColor = data.color === 'green' ? '#d4edda' : '#fff3cd';
            }
        });

        // Lắng nghe danh sách học viên nhảy điểm
        onValue(ref(db, 'current_results'), (snap) => {
            const data = snap.val();
            const tbody = document.getElementById('studentData');
            tbody.innerHTML = "";
            if(!data) return;

            // Hiển thị kết quả của folder gần nhất
            const folders = Object.keys(data);
            const latestFolder = folders[folders.length - 1];
            const results = data[latestFolder];

            Object.keys(results).sort().forEach(stt => {
                const s = results[stt];
                const row = `<tr>
                    <td><b>${stt}</b></td>
                    <td>${s.name}</td>
                    <td style="color:red; font-weight:bold">${s.score}</td>
                    <td><small>${s.time}</small></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        });
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f0f2f5; }
        .card { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
        #sysStatus { padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; font-weight: bold; transition: 0.3s; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; color: #555; }
        tr:hover { background: #fcfcfc; }
    </style>
</head>
<body>
    <div class="card">
        <h2>VDC SAFETY - BẢNG ĐIỂM ONLINE</h2>
        <div id="sysStatus">Đang kết nối Firebase...</div>
        <table>
            <thead>
                <tr><th>STT</th><th>Học viên</th><th>Điểm</th><th>Thời gian</th></tr>
            </thead>
            <tbody id="studentData">
                <tr><td colspan="4" style="text-align:center">Đang đợi bài chấm đầu tiên...</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
