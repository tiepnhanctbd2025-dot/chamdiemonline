<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDC SAFETY - REMOTE DASHBOARD</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0g2jxFOY5KQGZeZWyJf0SDxA91sitpxE",
            authDomain: "chamdiemonline-898b1.firebaseapp.com",
            projectId: "chamdiemonline-898b1",
            databaseURL: "https://chamdiemonline-898b1-default-rtdb.firebaseio.com/",
            appId: "1:1073615877091:web:b70fa88f2cf740085fe6d6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyYCwNwlzsF2X12b18vGuttZBirTPkvTMnoOWL4MFC6rVFAaM1XFJQgHfFjGPZWWosp/exec";

        window.onload = () => {
            fetch(`${GAS_URL}?action=getFolders`)
            .then(res => res.json())
            .then(data => {
                const sel = document.getElementById('folderSelect');
                data.forEach(f => sel.add(new Option(f.name, f.id)));
            });
        };

        window.toggleGrading = function(action) {
            const sel = document.getElementById('folderSelect');
            if (action === 'start') {
                if(!sel.value) return alert("Vui lòng chọn thư mục!");
                set(ref(db, 'control'), {
                    status: "running",
                    current_folder_id: sel.value,
                    current_folder_name: sel.options[sel.selectedIndex].text,
                    timestamp: Date.now()
                });
            } else {
                update(ref(db, 'control'), { status: "stopped" });
            }
        };

        onValue(ref(db, 'control'), (snap) => {
            const data = snap.val();
            const isRun = data && data.status === "running";
            document.getElementById('btnStart').style.display = isRun ? "none" : "block";
            document.getElementById('btnStop').style.display = isRun ? "block" : "none";
            document.getElementById('folderSelect').disabled = isRun;
        });

        onValue(ref(db, 'status'), (snap) => {
            const data = snap.val();
            if(data) {
                const el = document.getElementById('sysStatus');
                el.innerText = data.msg;
                el.className = "status-bar " + (data.color || "blue");
            }
        });

        onValue(ref(db, 'current_results'), (snap) => {
            const data = snap.val();
            const tbody = document.getElementById('studentData');
            tbody.innerHTML = "";
            if(!data) return;
            const latestFolder = Object.keys(data).pop();
            const results = data[latestFolder];
            Object.keys(results).sort().forEach(stt => {
                const s = results[stt];
                tbody.innerHTML += `<tr><td>${stt}</td><td>${s.name}</td><td class="score">${s.score}</td><td><span class="badge">${s.status}</span></td></tr>`;
            });
        });
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; background: #f4f6f9; }
        .card { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .status-bar { padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; border: 1px solid #ddd; }
        .blue { background: #e7f3ff; color: #007bff; } .green { background: #d4edda; color: #28a745; } .orange { background: #fff3cd; color: #856404; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        select { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
        button { padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-start { background: #28a745; } .btn-stop { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        .score { color: #d93025; font-weight: bold; }
        .badge { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="text-align:center; color:#1a73e8;">VDC SAFETY MONITOR</h3>
        <div id="sysStatus" class="status-bar blue">Đang khởi động hệ thống...</div>
        <div class="controls">
            <select id="folderSelect"><option value="">-- Chọn thư mục --</option></select>
            <button id="btnStart" class="btn-start" onclick="toggleGrading('start')">BẮT ĐẦU</button>
            <button id="btnStop" class="btn-stop" onclick="toggleGrading('stop')" style="display:none;">DỪNG</button>
        </div>
        <table>
            <thead><tr><th>STT</th><th>Học viên</th><th>Điểm</th><th>Trạng thái</th></tr></thead>
            <tbody id="studentData"></tbody>
        </table>
    </div>
</body>
</html>
