<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDC SAFETY - PRO DASHBOARD</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0g2jxFOY5KQGZeZWyJf0SDxA91sitpxE",
            authDomain: "chamdiemonline-898b1.firebaseapp.com",
            projectId: "chamdiemonline-898b1",
            databaseURL: "https://chamdiemonline-898b1-default-rtdb.firebaseio.com/",
            appId: "1:1073615877091:web:b70fa88f2cf740085fe6d6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyYCwNwlzsF2X12b18vGuttZBirTPkvTMnoOWL4MFC6rVFAaM1XFJQgHfFjGPZWWosp/exec";

        window.onload = () => {
            fetch(`${GAS_URL}?action=getFolders`)
            .then(res => res.json())
            .then(data => {
                const sel = document.getElementById('folderSelect');
                data.forEach(f => sel.add(new Option(f.name, f.id)));
            });
        };

        window.toggleGrading = function(action) {
            const sel = document.getElementById('folderSelect');
            if (action === 'start') {
                if(!sel.value) return alert("Vui lòng chọn thư mục!");
                set(ref(db, 'control'), {
                    status: "running",
                    current_folder_id: sel.value,
                    current_folder_name: sel.options[sel.selectedIndex].text,
                    timestamp: Date.now()
                });
            } else {
                update(ref(db, 'control'), { status: "stopped" });
            }
        };

        onValue(ref(db, 'control'), (snap) => {
            const data = snap.val();
            const isRun = data && data.status === "running";
            document.getElementById('btnStart').style.display = isRun ? "none" : "block";
            document.getElementById('btnStop').style.display = isRun ? "block" : "none";
            document.getElementById('folderSelect').disabled = isRun;
            const badge = document.getElementById('gasMode');
            badge.innerText = isRun ? "ĐANG CHẠY" : "ĐANG NGHỈ";
            badge.className = "mode-badge " + (isRun ? "run" : "rest");
        });

        onValue(ref(db, 'status'), (snap) => {
            const data = snap.val();
            if(data) {
                const el = document.getElementById('sysStatus');
                el.innerText = data.msg;
                el.className = "status-bar " + (data.color || "blue");
            }
        });

        onValue(ref(db, 'current_results'), (snap) => {
            const data = snap.val();
            const tbody = document.getElementById('studentData');
            tbody.innerHTML = "";
            if(!data) return;
            const latestFolder = Object.keys(data).pop();
            const results = data[latestFolder];
            Object.keys(results).sort().forEach(stt => {
                const s = results[stt];
                tbody.innerHTML += `<tr><td>${stt}</td><td>${s.name}</td><td class="score">${s.score}</td><td><span class="badge-done">Xong</span></td></tr>`;
            });
        });
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; background: #f0f2f5; }
        .card { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .mode-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .mode-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .run { background: #e6fffa; color: #38b2ac; border: 1px solid #38b2ac; }
        .rest { background: #edf2f7; color: #718096; border: 1px solid #718096; }
        .status-bar { padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .blue { background: #e7f3ff; color: #007bff; } .green { background: #d4edda; color: #28a745; } .orange { background: #fff3cd; color: #856404; } .grey { background: #f8f9fa; color: #6c757d; }
        .controls { display: flex; gap: 10px; margin-bottom: 25px; }
        select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; }
        button { padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-start { background: #3182ce; } .btn-stop { background: #e53e3e; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #edf2f7; text-align: left; }
        .score { color: #e53e3e; font-weight: bold; }
        .badge-done { background: #c6f6d5; color: #2f855a; padding: 3px 8px; border-radius: 5px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mode-container">
            <h3 style="margin:0; color:#2d3748;">VDC SAFETY PRO</h3>
            <span id="gasMode" class="mode-badge rest">ĐANG NGHỈ</span>
        </div>
        <div id="sysStatus" class="status-bar grey">Chưa có hoạt động</div>
        <div class="controls">
            <select id="folderSelect"><option value="">-- Chọn đợt chấm --</option></select>
            <button id="btnStart" class="btn-start" onclick="toggleGrading('start')">BẮT ĐẦU</button>
            <button id="btnStop" class="btn-stop" onclick="toggleGrading('stop')" style="display:none;">DỪNG</button>
        </div>
        <table>
            <thead><tr><th>STT</th><th>Học viên</th><th>Điểm</th><th>Kết quả</th></tr></thead>
            <tbody id="studentData"></tbody>
        </table>
    </div>
</body>
</html>
